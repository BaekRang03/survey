<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>흡입 헤드 감성 설문</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: 한 화면에 한 모델. 사진 → 20개 형용사 쌍(7칸) → 선호도(7칸) → 하단 이전/다음 */
:root {
  --bg: #f1f3f5;
  --card: #ffffff;
  --fg: #151a21;
  --muted: #566170;
  --line: #cfd6de;
  --accent: #2b44c8;
  --accent-ink: #ffffff;
  --warn: #b3261e;
  --warn-bg: #fdecea;
  --font: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1318; --card: #181d24; --fg: #e8ecf1; --muted: #9aa5b3; --line: #313a45;
    --accent: #93a5ff; --accent-ink: #0f1318; --warn: #ff9189; --warn-bg: #3a1f1e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1318; --card: #181d24; --fg: #e8ecf1; --muted: #9aa5b3; --line: #313a45;
  --accent: #93a5ff; --accent-ink: #0f1318; --warn: #ff9189; --warn-bg: #3a1f1e;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { color-scheme: light; }
body { margin: 0; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font);
  font-size: 15px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 0;
  word-break: keep-all;
}
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
h1 { font-size: 22px; line-height: 1.3; margin: 0; font-weight: 700; text-wrap: balance; }
h2 { font-size: 17px; margin: 0; font-weight: 600; text-wrap: balance; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.eyebrow { font-size: 12px; letter-spacing: .06em; color: var(--muted); font-weight: 600; }

.progress { display: flex; flex-direction: column; gap: 6px; }
.progress .meta { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); transition: width .2s; }

.photo { background: #fff; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: flex; justify-content: center; }
.photo img { display: block; width: 100%; max-height: 340px; object-fit: contain; }
.product { display: flex; flex-direction: column; gap: 2px; }
.product b { font-size: 17px; font-weight: 700; }
.src { font-size: 12px; color: var(--muted); }

.how { font-size: 13.5px; color: var(--muted); }

.row { border: 0; border-top: 1px solid var(--line); padding: 14px 0 12px; margin: 0; min-width: 0; }
.row:first-of-type { border-top: 0; }
.row.missing { background: var(--warn-bg); border-radius: 8px; padding-left: 8px; padding-right: 8px; }
.words { display: flex; justify-content: space-between; gap: 12px; font-weight: 500; font-size: 15px; margin-bottom: 8px; }
.words span:last-child { text-align: right; }
.dots { position: relative; display: grid; grid-template-columns: repeat(7, 1fr); align-items: center; justify-items: center; }
.dots::before { content: ""; position: absolute; left: calc(100% / 14); right: calc(100% / 14); top: 50%; height: 2px; background: var(--line); transform: translateY(-50%); }
.dot {
  position: relative; z-index: 1; width: 38px; height: 38px; border-radius: 50%;
  border: 2px solid var(--line); background: var(--card); cursor: pointer; padding: 0;
  display: grid; place-items: center; color: var(--accent-ink); font: inherit;
}
.dot.mid { border-color: var(--muted); }
.dot:hover { border-color: var(--accent); }
.dot:focus-visible, .btn:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.dot[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }
.dot[aria-pressed="true"]::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent-ink); }
.dlabels { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 11px; color: var(--muted); margin-top: 6px; line-height: 1.25; }

.scale-head { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--card); display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 11px; color: var(--muted); padding: 8px 0; border-bottom: 1px solid var(--line); line-height: 1.2; }

.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-weight: 600; }
input[type=text] { font: inherit; font-size: 16px; padding: 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); width: 100%; }
.nav { position: sticky; bottom: 0; background: var(--bg); padding-top: 10px; padding-bottom: 12px; display: flex; gap: 10px; border-top: 1px solid var(--line); margin-top: 4px; }
.btn { font: inherit; font-weight: 600; font-size: 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--fg); padding: 13px 18px; cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); flex: 1; }
.btn[disabled] { opacity: .5; cursor: default; }
.msg { color: var(--warn); font-weight: 500; font-size: 14px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
textarea { width: 100%; min-height: 110px; font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; white-space: nowrap; }
th { font-weight: 600; color: var(--muted); }
.order { font-variant-numeric: tabular-nums; letter-spacing: .02em; }
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
</style>

</head><body>

    7: { name: "DANEENON 지능형 배설케어로봇", sub: "분리형 착용 헤드 사선", src: "daneenon.com" }
  };
  var ORDERS = {
    r1: [3,5,1,7,2,6,4], r2: [6,2,7,4,1,3,5], r3: [2,7,3,6,5,1,4], r4: [5,1,4,2,7,6,3], r5: [7,4,2,5,3,1,6],
    r6: [1,6,3,7,4,5,2], r7: [4,3,6,1,2,7,5], r8: [2,5,7,3,6,4,1], r9: [6,1,5,4,3,2,7], r10: [3,7,1,5,2,4,6]
  };
  var PAIRS = [
    ["간결한","복잡한"],["곡선적인","각진"],["아담해 보이는","커 보이는"],["밀착감 있는","들뜬 느낌의"],["단정한","어수선한"],
    ["부드러워 보이는","딱딱해 보이는"],["유연해 보이는","뻣뻣해 보이는"],["포근해 보이는","배길 것 같은"],
    ["몸에 맞아 보이는","몸에 맞지 않아 보이는"],["편안해 보이는","불편해 보이는"],["안정감 있는","불안정한"],["안심되는","불안한"],
    ["친근한","낯선"],["부담 없는","부담스러운"],["배려가 느껴지는","배려가 부족한"],["청결해 보이는","불결해 보이는"],
    ["산뜻한","답답한"],["관리하기 쉬워 보이는","관리하기 어려워 보이는"],["착용하기 쉬워 보이는","착용하기 어려워 보이는"],["믿음직한","미덥지 않은"]
  ];
  var SCALE = ["매우","어느 정도","약간","중간","약간","어느 정도","매우"];
  var PREF_SCALE = ["매우","어느 정도","조금","중간","조금","어느 정도","매우"];
  // 구글 Apps Script 웹 앱 URL을 아래 따옴표 안에 붙여넣으세요.
  var ENDPOINT = "https://script.google.com/macros/s/AKfycbyglQofCxTLO3jnDjqHH84zdzfidyI2ihbXtBQRuR-xi6MeoQK_pBTPM5aAifNdC5SnOQ/exec";
  var app = document.getElementById("app");
  var route = (location.hash || "").replace("#", "");
  var state = null;
  var step = 0;

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function fresh(order) {
    var ans = {};
    order.forEach(function (n) { ans[n] = { k: new Array(PAIRS.length).fill(null), p: null }; });
    return { name: "", ans: ans };
  }
  function save() { try { localStorage.setItem("hs-" + route, JSON.stringify({ state: state, step: step })); } catch (e) {} }
  function load() {
    try {
      var raw = localStorage.getItem("hs-" + route);
      if (!raw) return;
      var d = JSON.parse(raw);
      if (d && d.state && d.state.ans) { state = d.state; step = Math.min(d.step || 0, 7); }
    } catch (e) {}
  }

  function dotsHtml(kind, q, left, right, cur) {
    var h = '<div class="dots" role="radiogroup">';
    for (var v = 1; v <= 7; v++) {
      var lab = v === 4 ? "중간" : (v < 4 ? left + " " + SCALE[v - 1] : right + " " + SCALE[v - 1]);
      h += '<button type="button" class="dot' + (v === 4 ? " mid" : "") + '" data-kind="' + kind + '" data-q="' + q + '" data-v="' + v + '" aria-pressed="' + (cur === v) + '" aria-label="' + esc(lab) + '"></button>';
    }
    return h + "</div>";
  }

  function viewIndex() {
    var h = '<h1>흡입 헤드 감성 설문 링크</h1><div class="panel"><p class="muted">응답자에게는 각자 다른 링크(#r1 ~ #r10)를 보내 주세요. 링크 끝의 번호가 제시 순서를 정합니다.</p><div class="tbl"><table><thead><tr><th>링크</th><th>모델 제시 순서</th></tr></thead><tbody>';
    Object.keys(ORDERS).forEach(function (k) { h += "<tr><td>#" + k + '</td><td class="order">' + ORDERS[k].join(" - ") + "</td></tr>"; });
    h += '</tbody></table></div><p class="small muted">응답은 연결한 구글 시트에 쌓여요.</p></div>';
    app.innerHTML = h;
  }

  function viewIntro() {
    app.innerHTML =
      '<div class="eyebrow">흡입 헤드 형상 평가</div><h1>흡입 헤드 감성 및 선호도 평가</h1>' +
      '<div class="panel"><p>사진 7장을 한 장씩 보고, 사진 속 착용 컵의 <b>겉모습에서 받는 인상</b>을 답해 주세요. 한 장에 2~3분 정도 걸려요.</p>' +
      '<ul class="how" style="margin:0;padding-left:18px"><li>감성 20줄: 왼쪽·오른쪽 단어 중 가까운 쪽의 칸을 누르세요. 가운데는 중간이에요.</li><li>선호도 1줄: 싫어한다에서 좋아한다 사이 한 칸을 누르세요.</li><li>밀착감·편안함·청결감·관리 용이성은 실제 성능이 아니라 사진 인상으로 답해 주세요.</li><li>사진마다 촬영 각도와 배율이 달라요. 실제 크기 비교가 아니에요.</li></ul>' +
      '<div class="field"><label for="nm">이름</label><input type="text" id="nm" autocomplete="name" value="' + esc(state.name) + '" placeholder="이름을 입력하세요"></div><p class="msg" id="err" hidden></p></div>' +
      '<div class="nav"><button class="btn primary" id="go">시작하기</button></div>';
    document.getElementById("go").onclick = function () {
      var v = document.getElementById("nm").value.trim();
      if (!v) { var e = document.getElementById("err"); e.textContent = "이름을 입력해 주세요."; e.hidden = false; return; }
      state.name = v; step = 1; save(); render();
    };
  }

  function viewModel() {
    var order = ORDERS[route], n = order[step - 1], m = MODELS[n], a = state.ans[n];
    var h = '<div class="progress"><div class="meta"><span>' + step + " / 7</span><span>모델 " + n + '</span></div><div class="bar"><i style="width:' + (step - 1) / 7 * 100 + '%"></i></div></div>';
    h += '<div class="photo"><img src="' + IMG[n] + '" alt="모델 ' + n + ' 착용 컵 사진"></div>';
    h += '<div class="product"><b>' + esc(m.name) + '</b><span class="muted">' + esc(m.sub) + '</span><span class="src">이미지 출처: ' + esc(m.src) + ' · 제품 및 이미지 출처 참조</span></div>';
    h += '<div class="panel"><h2>흡입 헤드 형상에 대한 감성 평가</h2><p class="how">사진 속 착용 컵 전체 형상을 기준으로, 왼쪽·오른쪽 단어 중 가까운 쪽의 칸을 누르세요.</p>';
    h += '<div class="scale-head" aria-hidden="true">' + SCALE.map(function (s) { return "<span>" + s + "</span>"; }).join("") + "</div>";
    PAIRS.forEach(function (p, i) {
      h += '<fieldset class="row" id="q' + i + '"><legend class="sr">' + esc(p[0]) + " 대 " + esc(p[1]) + '</legend><div class="words"><span>' + esc(p[0]) + "</span><span>" + esc(p[1]) + "</span></div>" + dotsHtml("k", i, p[0], p[1], a.k[i]) + "</fieldset>";
    });
    h += "</div>";
    h += '<div class="panel"><h2>흡입 헤드 형상에 대한 선호도 평가</h2><fieldset class="row" id="qp" style="border-top:0"><legend class="sr">선호도</legend><div class="words"><span>싫어한다</span><span>좋아한다</span></div>' + dotsHtml("p", 0, "싫어한다", "좋아한다", a.p) +
         '<div class="dlabels" aria-hidden="true">' + PREF_SCALE.map(function (s) { return "<span>" + s + "</span>"; }).join("") + "</div></fieldset></div>";
    h += '<p class="msg" id="err" hidden></p>';
    h += '<div class="nav"><button class="btn" id="back">이전</button><button class="btn primary" id="next">' + (step === 7 ? "제출하기" : "다음 모델") + "</button></div>";
    app.innerHTML = h;
    window.scrollTo(0, 0);
    document.getElementById("back").onclick = function () { step--; save(); render(); };
    document.getElementById("next").onclick = function () { validateAndNext(n); };
  }

  function validateAndNext(n) {
    var a = state.ans[n], miss = [];
    a.k.forEach(function (v, i) { if (v == null) miss.push("q" + i); });
    if (a.p == null) miss.push("qp");
    document.querySelectorAll(".row.missing").forEach(function (el) { el.classList.remove("missing"); });
    var err = document.getElementById("err");
    if (miss.length) {
      miss.forEach(function (id) { document.getElementById(id).classList.add("missing"); });
      err.textContent = "아직 답하지 않은 줄이 " + miss.length + "개 있어요. 붉게 표시된 줄을 확인해 주세요.";
      err.hidden = false;
      document.getElementById(miss[0]).scrollIntoView({ block: "center", behavior: "smooth" });
      return;
    }
    if (step === 7) { submit(); } else { step++; save(); render(); }
  }

  function record() {
    var order = ORDERS[route], answers = {};
    order.forEach(function (n) { answers[n] = { k: state.ans[n].k, p: state.ans[n].p }; });
    return { name: state.name, link: route, order: order, answers: answers, submittedAt: new Date().toISOString() };
  }

  function viewDone(status, rec) {
    var h = '<h1>응답해 주셔서 감사합니다</h1><div class="panel">';
    if (status === "saved") {
      h += "<p>응답이 저장됐어요. 이 창을 닫으셔도 돼요.</p>";
    } else {
      h += "<p><b>자동 저장이 되지 않았어요.</b> 아래 응답 코드를 복사해서 설문을 보낸 사람에게 메신저로 보내 주세요.</p>" +
           '<textarea id="code" readonly>' + esc(JSON.stringify(rec)) + '</textarea><div class="nav" style="position:static;border:0;padding:0"><button class="btn primary" id="copy">응답 코드 복사</button></div><p class="msg" id="err" hidden></p>';
    }
    h += "</div>";
    app.innerHTML = h;
    var c = document.getElementById("copy");
    if (c) c.onclick = function () {
      var t = document.getElementById("code"); t.select();
      var ok = function () { c.textContent = "복사했어요"; };
      var fail = function () { var e = document.getElementById("err"); e.textContent = "복사하지 못했어요. 코드 칸을 길게 눌러 전체 선택 후 복사해 주세요."; e.hidden = false; };
      try { navigator.clipboard.writeText(t.value).then(ok, fail); } catch (e) { fail(); }
    };
  }

  function submit() {
    var rec = record();
    var btn = document.getElementById("next"); btn.disabled = true; btn.textContent = "저장 중…";
    var done = function (ok) {
      if (ok) { try { localStorage.removeItem("hs-" + route); } catch (e) {} }
      step = 8; viewDone(ok ? "saved" : "fallback", rec);
    };
    if (!ENDPOINT) { done(false); return; }
    fetch(ENDPOINT, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(rec) })
      .then(function () { done(true); }, function () { done(false); });
  }

  function csvOf(rows) {
    var head = ["이름", "링크", "제출시각", "순서"];
    for (var n = 1; n <= 7; n++) { head.push("m" + n + "_선호"); for (var q = 1; q <= PAIRS.length; q++) head.push("m" + n + "_q" + (q < 10 ? "0" : "") + q); }
    var out = [head.join(",")];
    rows.forEach(function (r) {
      var c = [r.name, r.link, r.submittedAt, (r.order || []).join("-")];
      for (var n = 1; n <= 7; n++) { var a = (r.answers || {})[n] || { k: [], p: "" }; c.push(a.p == null ? "" : a.p); for (var q = 0; q < PAIRS.length; q++) c.push(a.k && a.k[q] != null ? a.k[q] : ""); }
      out.push(c.map(function (x) { return '"' + String(x).replace(/"/g, '""') + '"'; }).join(","));
    });
    return out.join("\n");
  }

  function viewResults() {
    app.innerHTML = '<h1>응답 결과</h1><div class="panel"><p class="muted" id="st">불러오는 중…</p></div>';
    if (!window.claude || !window.claude.use) { document.getElementById("st").textContent = "결과를 불러올 수 없어요."; return; }
    window.claude.use("db").then(function (db) {
      if (!db) { document.getElementById("st").textContent = "결과를 불러올 수 없어요. 설문을 만든 계정으로 로그인해서 열어 주세요."; return; }
      db.collection("responses").orderBy("submittedAt").onSnapshot(function (snap) {
        var rows = snap.docs.map(function (d) { return d.data(); });
        var h = '<h1>응답 결과</h1><div class="panel"><p><b>' + rows.length + "명</b> 응답 / 10명</p>";
        if (rows.length) {
          h += '<div class="tbl"><table><thead><tr><th>이름</th><th>링크</th><th>순서</th>';
          for (var n = 1; n <= 7; n++) h += "<th>모델" + n + " 선호</th>";
          h += "</tr></thead><tbody>";
          rows.forEach(function (r) {
            h += "<tr><td>" + esc(r.name) + "</td><td>#" + esc(r.link) + '</td><td class="order">' + esc((r.order || []).join("-")) + "</td>";
            for (var n = 1; n <= 7; n++) { var a = (r.answers || {})[n]; h += "<td>" + (a && a.p != null ? a.p : "-") + "</td>"; }
            h += "</tr>";
          });
          h += "<tr><th>평균</th><th></th><th></th>";
          for (var m = 1; m <= 7; m++) { var s = 0, c = 0; rows.forEach(function (r) { var a = (r.answers || {})[m]; if (a && a.p != null) { s += a.p; c++; } }); h += "<th>" + (c ? (s / c).toFixed(2) : "-") + "</th>"; }
          h += '</tr></tbody></table></div><p class="small muted">선호도 1 = 싫어한다 매우, 4 = 중간, 7 = 좋아한다 매우. 감성 문항은 1 = 왼쪽 단어 매우, 7 = 오른쪽 단어 매우.</p>' +
               '<textarea id="csv" readonly>' + esc(csvOf(rows)) + '</textarea><button class="btn primary" id="cc">전체 응답 CSV 복사</button><p class="msg" id="err" hidden></p>';
        }
        h += "</div>";
        app.innerHTML = h;
        var cc = document.getElementById("cc");
        if (cc) cc.onclick = function () {
          var t = document.getElementById("csv"); t.select();
          var ok = function () { cc.textContent = "복사했어요"; };
          var fail = function () { var e = document.getElementById("err"); e.textContent = "복사하지 못했어요. 칸을 길게 눌러 전체 선택 후 복사해 주세요."; e.hidden = false; };
          try { navigator.clipboard.writeText(t.value).then(ok, fail); } catch (e) { fail(); }
        };
      }, function () { document.getElementById("st").textContent = "결과를 읽을 권한이 없어요. 설문을 만든 계정으로 열어 주세요."; });
    }, function () { document.getElementById("st").textContent = "결과를 불러올 수 없어요."; });
  }

  function render() {
    if (!ORDERS[route]) { viewIndex(); return; }
    if (!state) { state = fresh(ORDERS[route]); load(); }
    if (step === 0) viewIntro(); else if (step <= 7) viewModel();
  }

  app.addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest(".dot") : null;
    if (!b || !ORDERS[route] || step < 1 || step > 7) return;
    var n = ORDERS[route][step - 1], a = state.ans[n], v = +b.dataset.v, q = +b.dataset.q;
    if (b.dataset.kind === "p") a.p = v; else a.k[q] = v;
    var row = b.closest(".row");
    row.querySelectorAll(".dot").forEach(function (d) { d.setAttribute("aria-pressed", String(d === b)); });
    row.classList.remove("missing");
    save();
  });

  window.addEventListener("hashchange", function () { route = (location.hash || "").replace("#", ""); state = null; step = 0; render(); });
  render();
})();
</script>
</body></html>
